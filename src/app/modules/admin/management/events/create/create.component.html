<div class="flex flex-auto flex-col overflow-y-auto p-6">

    <!-- Header -->
    <div class="flex items-center justify-between">
        <!-- Title -->
        <div class="mt-3 truncate text-4xl font-bold">
            Nouvel événement
        </div>

        <!-- Close button -->
        <a mat-icon-button [routerLink]="['../']">
            <mat-icon [svgIcon]="'heroicons_outline:x-mark'"></mat-icon>
        </a>
    </div>

    <div>
        <form class="flex w-full flex-col p-0 sm:p-6 gap-6" [formGroup]="newEventForm">

            <div class="flex flex-col gap-5">
                <div>
                    <mat-form-field class="w-full" [subscriptSizing]="'dynamic'">
                        <mat-label>Nom</mat-label>
                        <input matInput
                               [formControlName]="'name'" />
                    </mat-form-field>
                </div>

                <div class="flex flex-row items-center gap-4">
                    <mat-form-field class="fuse-mat-dense w-full h-fit" [subscriptSizing]="'dynamic'">
                        <mat-label>Date de début</mat-label>
                        <input
                            matInput
                            [matDatepicker]="fromDatepicker"
                            [formControlName]="'fromDate'">
                        <mat-datepicker-toggle matSuffix [for]="fromDatepicker"></mat-datepicker-toggle>
                        <mat-datepicker #fromDatepicker></mat-datepicker>
                    </mat-form-field>

                    <mat-form-field class="fuse-mat-dense w-full h-fit" [subscriptSizing]="'dynamic'">
                        <mat-label>Date de fin</mat-label>
                        <input
                            matInput
                            [matDatepicker]="toDatepicker"
                            [formControlName]="'toDate'">
                        <mat-datepicker-toggle matSuffix [for]="toDatepicker"></mat-datepicker-toggle>
                        <mat-datepicker #toDatepicker></mat-datepicker>
                    </mat-form-field>
                </div>

                <!-- Image file -->
                <div class="flex flex-col">
                    <div class="flex flex-col mb-1.5">
                        <span class="font-medium leading-tight">Image</span>
<!--                        <span class="text-sm text-secondary">Idéal : 500x500px (carré), format WEBP </span>-->
                    </div>

                    @if (eventImgFile) {
                        <div class="relative group h-24 md:h-30 w-24 md:w-30 rounded">
                            <img
                                [src]="eventImgPreviewUrl"
                                class="w-full h-full object-cover rounded border" alt=""/>

                            <!-- Boutons d'action au survol -->
                            <div class="absolute inset-0 flex items-center justify-center bg-black bg-opacity-70 opacity-0 group-hover:opacity-100 transition-opacity z-20">
                                <button
                                    mat-icon-button
                                    type="button"
                                    (click)="viewImage()"
                                    class="mr-1 h-8 min-h-8 w-8 hover:bg-white hover:bg-opacity-20"
                                    title="Visualiser l'image">
                                    <mat-icon [color]="'primary'" [svgIcon]="'heroicons_solid:eye'" class="icon-size-5"></mat-icon>
                                </button>

                                <button
                                    mat-icon-button
                                    type="button"
                                    (click)="removeImage()"
                                    class="ml-1 h-8 min-h-8 w-8 hover:bg-white hover:bg-opacity-20"
                                    title="Supprimer l'image">
                                    <mat-icon [color]="'primary'" [svgIcon]="'heroicons_solid:trash'" class="icon-size-5"></mat-icon>
                                </button>
                            </div>
                        </div>
                    } @else {
                        <!-- Add image -->
                        <div class="h-24 md:h-30 w-24 md:w-30">
                            <input
                                id="image-input"
                                class="absolute h-0 w-0 opacity-0 invisible pointer-events-none"
                                type="file"
                                accept="image/*"
                                [multiple]="true"
                                (change)="onImageChange($event)"
                                #importImageInput>

                            <label
                                class="h-full w-full flex flex-col items-center justify-center rounded cursor-pointer border hover:bg-gray-400 hover:bg-opacity-20 dark:hover:bg-black dark:hover:bg-opacity-5 transition-opacity"
                                for="image-input"
                                matRipple>
                                <mat-icon [color]="'primary'" [svgIcon]="'heroicons_outline:plus'" class="icon-size-7"></mat-icon>
                                <span class="mt-1 text-primary text-center text-sm font-medium">Ajouter</span>
                            </label>
                        </div>
                    }
                </div>

            </div>

            <!-- Action -->
            <div class="flex items-center justify-center">
                <button mat-flat-button
                        [color]="'primary'"
                        (click)="createEvent()"
                        [disabled]="newEventForm.disabled || newEventForm.invalid">
                    @if (newEventForm.enabled) {
                        <span>Créer</span>
                    } @else {
                        <mat-progress-spinner
                            [diameter]="24"
                            [mode]="'indeterminate'"></mat-progress-spinner>
                    }
                </button>
            </div>

        </form>
    </div>

</div>
